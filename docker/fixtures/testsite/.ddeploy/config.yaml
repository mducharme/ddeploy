db_env_scheme: laravel
additional_hostnames:
  - alt-testsite
additional_fqdns:
  - custom.ddeploy.test
persistent_files:
  - shared-notes.txt
client_max_body_size: 256m
fpm_max_children: 20
auth_exempt_paths:
  - /health
backup_exclude:
  - exclude-me/**
db_backup_retention_days: 14
php_ini:
  max_execution_time: 45
security_headers: true
static_cache: 7d
deny_php_in_uploads: true
redirects:
  - from: /old-home
    to: /
    code: 301
# ddeploy-only steps (README "Deploy hooks"): markers inside the checkout,
# so a test can tell which release ran which.
hooks:
  post-deploy:
    - exec: "touch .post-deploy-ran"
  post-provision:
    - exec: "touch .post-provision-ran"
