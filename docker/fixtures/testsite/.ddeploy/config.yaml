db_env_scheme: laravel
additional_hostnames:
  - alt-testsite
additional_fqdns:
  - custom.ddeploy.test
persistent_files:
  - shared-notes.txt
client_max_body_size: 256m
fpm_max_children: 20
auth_exempt_paths:
  - /health
backup_exclude:
  - exclude-me/**
db_backup_retention_days: 14
php_ini:
  max_execution_time: 45
