# Per-server configuration — the one file that differs between servers.
# Edit after cloning, then run `./provision.sh init`.
#
# Nothing here is a secret itself (the Cloudflare token and the git key
# live in the files CF_CREDENTIALS/GIT_DEPLOY_KEY point at) but both
# must be created out-of-band before `init` / `provision` run — see
# README.md.

BASE_DOMAIN="staging.example.com"                  # this server's wildcard root
SITES_ROOT="/home/deploy/sites"

# Where upload_dirs, a site's DB credential file, and any declared
# persistent_files: actually live — a site's own checkout only ever holds
# symlinks into here. `remove --purge-files` deletes the checkout (code)
# but never this (content) unless --purge-persistent is also given, and a
# later `provision` re-links to whatever's still here automatically. See
# README "Persistent files".
PERSISTENT_ROOT="/home/deploy/persistent"

CF_CREDENTIALS="/etc/letsencrypt/cloudflare.ini"    # Cloudflare token file (chmod 600, root-owned)
CERT_EMAIL="ops@youragency.com"
BASELINE_PHP="7.4 8.1 8.2 8.3"                      # versions `init` pre-installs
DEFAULT_PHP="8.3"                                   # interactive fallback default
BASIC_AUTH_DEFAULT="false"                          # client-site crawlability default (--auth)
CLIENT_MAX_BODY_SIZE="64m"                          # nginx upload-size ceiling; per-site override via .ddeploy/config.yaml
FPM_MAX_CHILDREN="5"                                # PHP-FPM pool concurrency ceiling; per-site override via .ddeploy/config.yaml

# Fallback htpasswd file for any site with auth enabled but no htpasswd
# of its own at /etc/nginx/htpasswd/<name> — `init` generates this one
# (random password, logged once) if it doesn't already exist, so a site
# with auth on (previews, by default) never ships a vhost pointing at a
# file that doesn't exist — nginx only fails on that at request time
# (every request 500s), not at `nginx -t`.
BASIC_AUTH_CREDENTIALS="/etc/nginx/htpasswd/default"

# Shared machine-user SSH private key with read access to every client
# repo (a bot account added as a collaborator/team member on each repo
# or org — not a GitHub-style per-repo "deploy key", which can't be
# reused across repos). Copied into each site wrapper's .ssh
# ($SITES_ROOT/<name>/.ssh — the Linux user's HOME) at provision/deploy
# time. Place it here, chmod 600, before provisioning.
GIT_DEPLOY_KEY="/home/deploy/.ssh/machine_deploy_key"

# Whether this server's wildcard is proxied (orange-cloud) through
# Cloudflare, not just resolved via it. When true, `init` restores real
# visitor IPs in nginx (from CF-Connecting-IP) and firewalls 80/443 down
# to Cloudflare's published ranges (SSH stays open). Set false for a
# grey-cloud domain, or one not behind Cloudflare's proxy at all.
CLOUDFLARE_PROXIED="true"

# PHP extensions installed alongside php<ver>-fpm/-cli for every version
# this server installs (baseline + anything `provision` lazily adds).
# Adjust to match what the CMS actually needs — the ondrej/php PPA `init`
# adds packages most common extensions per-version this way too (e.g.
# "imagick" -> php8.2-imagick), not just the ones listed here by default.
# Re-running init/provision after adding one here installs it for every
# already-provisioned PHP version, not just new ones.
PHP_EXTENSIONS="cli mysql mbstring xml curl zip gd"

# --- Node / frontend builds ----------------------------------------------
# Node versions are managed by one shared, root-owned nvm at NVM_ROOT
# (pinned + commit-verified by `init`). Each site gets the version its
# repo asks for (nodejs_version, .nvmrc — see README "Frontend builds"),
# installed on first use; BASELINE_NODE is what `init` pre-installs and
# refreshes to the newest patch release on every run. DEFAULT_NODE is
# what a site that declares nothing gets.
NODE_ENABLED="true"
NVM_ROOT="/opt/nvm"
BASELINE_NODE="20 22"
DEFAULT_NODE="22"
# Hard limits for one site's install + build (each step separately). The
# memory cap runs the build in its own cgroup, so an out-of-memory
# webpack/vite build is killed on its own instead of taking php-fpm or
# MariaDB down with it. Empty NODE_BUILD_MEMORY_MAX = no cap.
NODE_BUILD_TIMEOUT="1200"      # seconds
NODE_BUILD_MEMORY_MAX="2G"
# Keep each site's last node_modules (root-only, outside the releases)
# and reuse it — skipping the install — when the lockfile, package.json,
# Node version and package manager are all unchanged.
NODE_REUSE_MODULES="true"

# --- Database: local (default) or remote -------------------------------
# Leave DB_HOST as 127.0.0.1 for a database on this same server — `init`
# installs MariaDB locally and `provision` connects to it as local root
# over the unix socket, no credentials file needed. Point DB_HOST at a
# separate server instead to share one MariaDB instance across multiple
# web servers; that server should be set up with `init-db` (below), and
# DB_ADMIN_CREDENTIALS/DB_GRANT_HOST set to match what it created.
DB_HOST="127.0.0.1"
DB_ADMIN_CREDENTIALS=""     # MySQL option-file (chmod 600); required when DB_HOST isn't local
DB_GRANT_HOST="localhost"   # host granted to each site's DB user; set to this server's address when DB_HOST is remote

# --- `init-db` only: settings for a dedicated database server ----------
# Space-separated exact IPs allowed to connect as the admin account
# init-db creates (used both for the MySQL GRANT and the ufw rule — stick
# to exact IPs, since ufw's CIDR syntax and MySQL's host-wildcard syntax
# aren't the same, so a range needs setting up separately in each). Should
# include every web server's DB_GRANT_HOST value above.
DB_ALLOWED_HOSTS=""

# --- Uploads backup to object storage (optional) ------------------------
# Disaster-recovery only, not shared storage: each site's own upload_dirs
# (.ddev/config.yaml's key, or set via `provision --upload-dirs`) get
# synced one-way to object storage on a schedule. Local disk stays the
# copy actually served.
BACKUP_ENABLED="false"
BACKUP_CREDENTIALS=""        # BACKUP_ENDPOINT/BACKUP_BUCKET/BACKUP_ACCESS_KEY/BACKUP_SECRET_KEY (chmod 600); see README
BACKUP_SCHEDULE="17 * * * *" # cron schedule for the sync
UPLOADS_BACKUP_VERSIONS_DAYS="30" # files the sync would overwrite/delete are kept this long under <site>/.versions/ (0: plain mirror)

# --- Database backup to object storage (optional) -----------------------
# Same idea as uploads backup, same BACKUP_CREDENTIALS/BACKUP_BUCKET, but
# a running database's data files aren't safe to sync directly — this
# takes a mysqldump per site instead, so old dumps also need pruning.
DB_BACKUP_ENABLED="false"
DB_BACKUP_SCHEDULE="23 * * * *"   # cron schedule for the dump (offset from BACKUP_SCHEDULE)
DB_BACKUP_RETENTION_DAYS="7"      # dumps in object storage older than this get deleted

# --- Branch previews (provision-preview / deploy-preview / remove-preview)
# Default DB/uploads mode for a preview — "shared" links it to its parent
# project's actual database and uploads (no copy — see README "Branch
# previews" for why this is the default, not a compromise), "isolated"
# gives it a fully separate site's worth of its own. Override per call
# with --shared/--isolated.
PREVIEW_DB_MODE="shared"
PREVIEW_SEED="true"          # isolated mode only: seed DB+uploads from the parent once, at creation
# Previews from a plain push, no PR needed: branch patterns (space-
# separated) every site gets unless it sets its own preview_branches in
# .ddeploy/config.yaml (which replaces this; an empty list turns it off
# for that site). "*" is every branch; the branches a site deploys never
# get one. Each matching push builds and, in shared mode, runs that
# branch's migrations against the parent's data — prefer narrow
# patterns. Empty = previews only for PRs. See README "Branch previews".
PREVIEW_BRANCHES=""          # e.g. "feature/* fix/*"
PREVIEW_PRUNE_ENABLED="false" # cron: remove previews whose branch no longer exists on the remote
PREVIEW_PRUNE_SCHEDULE="37 3 * * *"

# How often `doctor --snapshot` checks every site in the background: the
# web UI's health column shows that last check (with its age) instead of
# running one per page view. It pages NOTIFY_WEBHOOK only when a check
# starts failing or recovers. Logs to /var/log/ddeploy/doctor.log.
DOCTOR_SCHEDULE="*/10 * * * *"

# --- Deploy on git push (GitHub + Bitbucket Cloud webhooks) -------------
# When true, `init` stands up https://hooks.$BASE_DOMAIN (POST /github and
# /bitbucket), HMAC-verified, and a root worker that maps those events onto
# deploy / provision-preview / deploy-preview / remove-preview. SSH
# `provision.sh deploy` stays valid. See README "Deploy on git push".
WEBHOOK_ENABLED="false"
WEBHOOK_HOSTNAME=""          # default hooks.$BASE_DOMAIN
WEBHOOK_SECRET="/etc/ddeploy/webhook.secret"   # generated by init (chmod 600, root:root — the listener itself never reads this, see README "Deploy on git push")
WEBHOOK_SECRET_BITBUCKET=""  # optional separate HMAC secret for POST /bitbucket
WEBHOOK_LISTEN="127.0.0.1:8787"

# --- Web UI (webddeploy) — README "Web UI" ---
# init-web (and init, when true) creates WEB_USER, its single sudoers rule
# (`provision.sh api *`) and an nginx vhost for WEB_HOSTNAME -> WEB_LISTEN.
WEB_ENABLED="false"
WEB_HOSTNAME=""              # default ddeploy.$BASE_DOMAIN — one label under it (wildcard cert)
WEB_LISTEN="127.0.0.1:8790"
WEB_USER="ddeploy-web"
RUN_LOG_RETENTION_DAYS="30"  # full per-run output logs in /var/log/ddeploy/runs/
WEB_IMPORT_MAX_MB="2048"     # largest database dump the web UI accepts for import
DB_SNAPSHOT_KEEP="5"         # local pre-import/manual DB snapshots kept per site (db-snapshot)
WEB_UPLOAD_MAX_MB="10240"    # largest uploads archive (or dropped folder) the web UI accepts
UPLOADS_SNAPSHOT_KEEP="3"    # uploads snapshots kept per site (hardlinks: free until files change)

# --- Notifications: Slack / Discord (optional) --------------------------
# Server-wide channel. Gets every event in NOTIFY_EVENTS, plus failure
# paging for unattended commands (backup cron, prune-previews, doctor).
# Slack incoming webhooks and Discord webhooks get native formatting;
# any other URL gets a flat JSON POST. The URL is a credential — do not
# commit it. Empty = off. A site can also have its own channel on top:
# `provision.sh notify <name> --set-url` (see README "Notifications").
NOTIFY_WEBHOOK=""
# Which events are sent (space-separated, remove the ones you don't want):
#   deploy-success    deploy / deploy-preview / provision finished (URL, commit, duration, who)
#   deploy-failure    any of those failed (the error line, how to see the full log)
#   preview-created   a branch preview is up (its URL)
#   preview-removed   a branch preview was torn down
#   webhook-rejected  a git-push webhook failed HMAC verification — almost
#                     always a wrong secret in the forge's webhook settings
NOTIFY_EVENTS="deploy-success deploy-failure preview-created preview-removed webhook-rejected"
# Seconds; failure paging and webhook-rejected messages for the same
# command+site will not repeat until it elapses (hourly backup failing
# all night = one message). Deploy messages are never rate-limited.
NOTIFY_COOLDOWN="3600"

# --- PR preview comments (optional) -------------------------------------
# After a git-push webhook successfully provisions or deploys a preview,
# post (or update) a comment on that PR with https://<slug>.$BASE_DOMAIN.
# Empty path = off. The file is a credential (chmod 600), one or both of:
#
#   GITHUB_TOKEN="ghp_..."                  # or a fine-grained token with
#                                           # Pull requests: Read and write
#   GITHUB_API="https://api.github.com"     # optional; GitHub Enterprise
#                                           # is https://ghe.example/api/v3
#   BITBUCKET_USER="bot"
#   BITBUCKET_APP_PASSWORD="..."            # pullrequest:write
#   BITBUCKET_TOKEN=""                      # optional Bearer instead of
#                                           # user+app password
#   BITBUCKET_API="https://api.bitbucket.org"
#
# The same comment is updated on later pushes (marker <!-- ddeploy-preview -->),
# so a PR does not accumulate a new URL line every synchronize. Tokens are
# never logged. A failed comment does not fail the deploy.
PREVIEW_COMMENT_CREDENTIALS=""

# How many release directories to keep per site (the live `current` plus
# this many minus one older trees). A failed deploy never consumes a
# slot — it is deleted before `current` is retargeted. Previews are
# in-place and ignore this.
RELEASES_KEEP="5"

# When a site's branch is force-pushed (rebased, amended), a deploy
# fails rather than throw away what's live: `deploy <name> --force`
# then deploys the new tip by hand. "true" follows force-pushes
# automatically (webhook deploys included) — fine on a staging server,
# where branches get rewritten routinely. Either way the previous
# release stays on disk for `deploy <name> --rollback`. Previews always
# follow force-pushes and ignore this.
ALLOW_FORCE_PUSH="false"
