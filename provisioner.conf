# Per-server configuration — the one file that differs between servers.
# Edit after cloning, then run `./provision.sh init`.
#
# Nothing here is a secret itself (the Cloudflare token and the git key
# live in the files CF_CREDENTIALS/GIT_DEPLOY_KEY point at) but both
# must be created out-of-band before `init` / `provision` run — see
# README.md.

BASE_DOMAIN="staging.example.com"                  # this server's wildcard root
SITES_ROOT="/home/deploy/sites"
CF_CREDENTIALS="/etc/letsencrypt/cloudflare.ini"    # Cloudflare token file (chmod 600, root-owned)
CERT_EMAIL="ops@youragency.com"
BASELINE_PHP="7.4 8.1 8.2 8.3"                      # versions `init` pre-installs
DEFAULT_PHP="8.3"                                   # interactive fallback default
BASIC_AUTH_DEFAULT="false"                          # client-site crawlability default (--auth)

# Shared machine-user SSH private key with read access to every client
# repo (a bot account added as a collaborator/team member on each repo
# or org — not a GitHub-style per-repo "deploy key", which can't be
# reused across repos). Copied into each site's own $dir/.ssh at
# provision/deploy time. Place it here, chmod 600, before provisioning.
GIT_DEPLOY_KEY="/home/deploy/.ssh/machine_deploy_key"

# Whether this server's wildcard is proxied (orange-cloud) through
# Cloudflare, not just resolved via it. When true, `init` restores real
# visitor IPs in nginx (from CF-Connecting-IP) and firewalls 80/443 down
# to Cloudflare's published ranges (SSH stays open). Set false for a
# grey-cloud domain, or one not behind Cloudflare's proxy at all.
CLOUDFLARE_PROXIED="true"

# PHP extensions installed alongside php<ver>-fpm/-cli for every version
# this server installs (baseline + anything `provision` lazily adds).
# Adjust to match what the CMS actually needs.
PHP_EXTENSIONS="cli mysql mbstring xml curl zip gd"

# --- Database: local (default) or remote -------------------------------
# Leave DB_HOST as 127.0.0.1 for a database on this same server — `init`
# installs MariaDB locally and `provision` connects to it as local root
# over the unix socket, no credentials file needed. Point DB_HOST at a
# separate server instead to share one MariaDB instance across multiple
# web servers; that server should be set up with `init-db` (below), and
# DB_ADMIN_CREDENTIALS/DB_GRANT_HOST set to match what it created.
DB_HOST="127.0.0.1"
DB_ADMIN_CREDENTIALS=""     # MySQL option-file (chmod 600); required when DB_HOST isn't local
DB_GRANT_HOST="localhost"   # host granted to each site's DB user; set to this server's address when DB_HOST is remote

# --- `init-db` only: settings for a dedicated database server ----------
# Space-separated exact IPs allowed to connect as the admin account
# init-db creates (used both for the MySQL GRANT and the ufw rule — stick
# to exact IPs, since ufw's CIDR syntax and MySQL's host-wildcard syntax
# aren't the same, so a range needs setting up separately in each). Should
# include every web server's DB_GRANT_HOST value above.
DB_ALLOWED_HOSTS=""

# --- Uploads backup to object storage (optional) ------------------------
# Disaster-recovery only, not shared storage: each site's own upload_dirs
# (.ddev/config.yaml's key, or set via `provision --upload-dirs`) get
# synced one-way to object storage on a schedule. Local disk stays the
# copy actually served.
BACKUP_ENABLED="false"
BACKUP_CREDENTIALS=""        # BACKUP_ENDPOINT/BACKUP_ACCESS_KEY/BACKUP_SECRET_KEY (chmod 600); see README
BACKUP_BUCKET=""             # bucket / space name
BACKUP_SCHEDULE="17 * * * *" # cron schedule for the sync

# --- Database backup to object storage (optional) -----------------------
# Same idea as uploads backup, same BACKUP_CREDENTIALS/BACKUP_BUCKET, but
# a running database's data files aren't safe to sync directly — this
# takes a mysqldump per site instead, so old dumps also need pruning.
DB_BACKUP_ENABLED="false"
DB_BACKUP_SCHEDULE="23 * * * *"   # cron schedule for the dump (offset from BACKUP_SCHEDULE)
DB_BACKUP_RETENTION_DAYS="7"      # dumps in object storage older than this get deleted
