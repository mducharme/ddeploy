# Per-droplet configuration. This is the ONE file that differs between
# droplets in the fleet. Edit these values after cloning the repo onto a
# new droplet, then run `./provision.sh init`.
#
# Nothing in this file is a secret itself (the Cloudflare token and the
# git deploy key live in the files CF_CREDENTIALS/GIT_DEPLOY_KEY point
# at, not here) but both must still be created out-of-band before `init`
# / `provision` run (see README.md).

BASE_DOMAIN="staging.example.com"                  # this droplet's wildcard root
SITES_ROOT="/home/deploy/sites"
CF_CREDENTIALS="/etc/letsencrypt/cloudflare.ini"    # Cloudflare token file (chmod 600, root-owned)
CERT_EMAIL="ops@youragency.com"
BASELINE_PHP="7.4 8.1 8.2 8.3"                      # versions `init` pre-installs
DEFAULT_PHP="8.3"                                   # used by the interactive fallback default
BASIC_AUTH_DEFAULT="false"                          # client-site crawlability default (--auth)

# Shared machine-user SSH private key with read access to every client
# repo (a bot account added as a collaborator / team member on each repo
# or org — NOT a GitHub-style per-repo "deploy key", which can't be
# reused across repos). Copied into each site's own $dir/.ssh at
# provision/deploy time. Place it here, chmod 600, before provisioning.
GIT_DEPLOY_KEY="/home/deploy/.ssh/machine_deploy_key"

# Whether this droplet's wildcard is proxied (orange-cloud) through
# Cloudflare, not just resolved via it. When true, `init` restores real
# visitor IPs in nginx (from CF-Connecting-IP, since Cloudflare's edge IP
# is otherwise all nginx/PHP ever sees) and firewalls 80/443 down to
# Cloudflare's published ranges (SSH stays open) so the origin can't be
# reached by going around the proxy. Set false for a droplet that's
# DNS-only (grey-cloud) or not behind Cloudflare's proxy at all.
CLOUDFLARE_PROXIED="true"

# PHP extensions installed alongside php<ver>-fpm/-cli for every version
# this droplet installs (baseline + anything `provision` lazily adds).
# CONFIRM AT BUILD TIME: adjust to match what the CMS actually needs.
PHP_EXTENSIONS="cli mysql mbstring xml curl zip gd"
